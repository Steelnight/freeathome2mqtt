name: Release

# Tag-triggered release (docs/11 WP12): builds the multi-arch container image, pushes it to GHCR,
# and publishes a GitHub release with auto-generated notes. Push a `vX.Y.Z` tag to trigger.
#
# Deliberately out of scope: a Home Assistant add-on wrapper (its own repo-structure conventions,
# named "optional" in docs/11 WP12's own deliverable list) is not built here -- a named,
# documented gap, not a silent one (CLAUDE.md §4).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A guard, not a duplicate of ci.yml: a tag normally points at a commit ci.yml already passed
  # on main, but nothing stops a tag being pushed at an unverified commit, and this is the one
  # place that would ship it to GHCR and a public GitHub release.
  test:
    name: Fast suite (release guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict src/
      - run: uv run pytest -m "not bench and not soak"

  release:
    name: Build, push, and publish a GitHub release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags/labels from the pushed tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push (multi-arch, docs/00 §5's target platforms)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
