[project]
name = "freeathome2mqtt"
version = "0.1.0"
description = "A performance-focused bridge between an ABB/Busch-Jaeger free@home SysAP and MQTT."
readme = "README.md"
requires-python = "==3.14.7"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "the freeathome2mqtt contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
dependencies = [
    "aiohttp>=3.9",
    "aiomqtt>=2.0",
    "orjson>=3.9",
    "uvloop>=0.19; platform_system != 'Windows'",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "zeroconf>=0.150.0",
]

[project.urls]
Repository = "https://github.com/steelnight/freeathome2mqtt"
Documentation = "https://github.com/steelnight/freeathome2mqtt/tree/main/docs"

[project.scripts]
freeathome2mqtt = "freeathome2mqtt.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.98",
    "ruff>=0.6",
    "mypy>=1.11",
    "testcontainers>=4.7",
    "types-jsonschema>=4.20",
    "types-PyYAML>=6.0",
    "amqtt>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freeathome2mqtt"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --cov=freeathome2mqtt --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "bench: performance budget benchmarks (docs/05 §1, §8); excluded from the fast suite",
    "soak: long-running soak tests, nightly only, never per-PR (docs/10 §8)",
    "integration: needs the fake SysAP and/or an embedded broker (docs/10 §3)",
]

[tool.coverage.run]
branch = true
source = ["src/freeathome2mqtt"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
fail_under = 90

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

